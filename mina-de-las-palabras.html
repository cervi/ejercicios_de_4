<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Mina de las Palabras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#BFE3F7; --sky2:#A6D6F0; --panel:#FFFFFF; --panel2:#F1F4F6; --ink:#1E1B18; --muted:#5B5650; --line:#2B2622;
  --grass:#5DA130; --grass2:#4A8A24; --dirt:#7A4E25; --stone:#8A8A8A; --torch:#FFB13B;
  --ok:#3E9B2F; --ok-bg:#E1F3D8; --bad:#C2412F; --bad-bg:#F9E2DD; --focus:#FFB13B;
  --pixel:"Pixelify Sans","Courier New",monospace; --body:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --sky:#11161F; --sky2:#0B0F16; --panel:#1E2430; --panel2:#262D3A; --ink:#EDEAE4; --muted:#A9A39A; --line:#000000;
    --ok:#6BCB52; --ok-bg:#1E3A1A; --bad:#F07467; --bad-bg:#3D1C17; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sky:#11161F; --sky2:#0B0F16; --panel:#1E2430; --panel2:#262D3A; --ink:#EDEAE4; --muted:#A9A39A; --line:#000000;
  --ok:#6BCB52; --ok-bg:#1E3A1A; --bad:#F07467; --bad-bg:#3D1C17; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:linear-gradient(var(--sky),var(--sky2));min-height:100vh;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;padding:14px 12px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.spr{display:block;image-rendering:pixelated}
.px{border:3px solid var(--line);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18),inset 4px 4px 0 rgba(255,255,255,.18)}
h2{font-family:var(--pixel);font-weight:700;font-size:28px;margin:26px 2px 10px;line-height:1.1}

/* Cabecera */
.head{background:var(--dirt);color:#fff;position:relative;padding:22px 16px 16px;border:3px solid var(--line)}
.head::before{content:"";position:absolute;left:0;right:0;top:0;height:12px;background:repeating-linear-gradient(90deg,var(--grass) 0 12px,var(--grass2) 12px 24px)}
.title{font-family:var(--pixel);font-weight:700;font-size:clamp(30px,8vw,46px);line-height:1;margin:4px 0 6px;text-shadow:3px 3px 0 #000}
.title small{display:block;font-size:.4em;color:var(--torch);text-shadow:2px 2px 0 #000;margin-bottom:6px}
.head-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipbtn{background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.6);color:#fff;font-size:15px;font-weight:800;padding:4px 12px;min-height:38px}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.slot-inv{background:rgba(0,0,0,.35);border:3px solid #000;display:flex;align-items:center;gap:8px;padding:6px 8px}
.slot-inv b{font-family:var(--pixel);font-size:24px;line-height:1;color:#fff;text-shadow:2px 2px 0 #000}
.slot-inv span{display:block;font-size:12px;color:#E8D9C4}

.intro{margin:14px 2px 0;color:var(--muted);font-weight:700;max-width:62ch}

/* Túneles */
.tunnels{display:grid;gap:10px}
.tunnel{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);padding:12px}
.tn-name{font-family:var(--pixel);font-weight:700;font-size:21px;line-height:1.15}
.tn-sub{font-size:15px;color:var(--muted);font-weight:700;line-height:1.3}
.tn-status{font-size:14px;font-weight:900;color:var(--ok)}
.go{background:var(--grass);color:#fff;font-family:var(--pixel);font-weight:700;font-size:18px;padding:10px 16px;min-height:48px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.go:disabled{background:var(--stone);cursor:not-allowed}
.tunnel.locked{opacity:.8}
.tunnel.final{background:var(--panel2)}

/* Casa */
.build{background:var(--panel);padding:14px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center}
.scene-house{background:linear-gradient(#9fd8ef,#d5effa);border:3px solid var(--line);overflow:hidden}
.scene-house svg{width:100%;height:auto;display:block}
.next-part h3{font-family:var(--pixel);font-weight:700;font-size:22px;margin:0 0 4px}
.next-part p{margin:0 0 10px;color:var(--muted);font-weight:700;font-size:16px}
.cost{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cost span{display:flex;align-items:center;gap:6px;font-weight:900;background:var(--panel2);padding:4px 8px;border:2px solid var(--line)}
.cost span.lack{color:var(--bad)}
.bar{height:14px;border:3px solid var(--line);background:var(--panel2);margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--grass)}

/* Logros */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.trophy{background:var(--panel);padding:10px;display:grid;gap:2px}
.trophy .ic{font-size:30px;line-height:1.2}
.trophy b{font-size:15px;line-height:1.25}
.trophy p{margin:0;font-size:13px;color:var(--muted);line-height:1.35;font-weight:700}
.trophy.off .ic{filter:grayscale(1);opacity:.35}
.trophy.off b{color:var(--muted)}
.reset{margin:28px 2px 0;background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;padding:6px 0}

/* Misión */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.back{background:var(--panel);font-weight:900;font-size:15px;padding:6px 12px;min-height:40px}
.tag{font-family:var(--pixel);font-weight:700;font-size:18px;text-align:right;line-height:1.1}
.shaft{background:var(--dirt);border:3px solid var(--line);padding:12px 10px 10px;position:relative}
.shaft::before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:repeating-linear-gradient(90deg,var(--grass) 0 10px,var(--grass2) 10px 20px)}
.depth{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:6px}
.cell{aspect-ratio:1;border:2px solid #000;position:relative;background:#3a2a1c}
.cell .spr{width:100%;height:100%}
.cell.now{outline:3px solid var(--torch);outline-offset:1px}
.cell.miss{background:repeating-linear-gradient(45deg,#2a1f16 0 4px,#3a2a1c 4px 8px)}
.cell.miss::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:#F07467;font-weight:900;font-size:clamp(12px,3.5vw,20px)}
.shaft-info{display:flex;justify-content:space-between;color:#fff;font-weight:800;font-size:14px;margin-top:8px;text-shadow:1px 1px 0 #000}

.card{background:var(--panel);padding:18px 16px;margin-top:12px}
.context{color:var(--muted);font-weight:800;margin:0 0 6px;font-size:16px}
.prompt{font-size:20px;font-weight:900;margin:0 0 14px;line-height:1.35}
.bigword{font-family:var(--pixel);font-weight:700;font-size:clamp(36px,10vw,52px);text-align:center;margin:4px 0 18px;line-height:1.1}
.sentence{font-size:clamp(20px,5.4vw,26px);font-weight:800;line-height:1.5;text-align:center;margin:4px 0 18px}
.sentence mark{background:var(--torch);color:#1E1B18;padding:0 4px}
.quote{background:var(--panel2);border-left:6px solid var(--grass);padding:12px 14px;font-size:18px;font-weight:700;margin:0 0 16px;line-height:1.5}
.blank{display:inline-block;min-width:4em;border-bottom:4px solid var(--torch);text-align:center;color:var(--muted)}
.words{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 6px}
.wbtn{background:var(--panel2);border:3px solid var(--line);font-size:clamp(18px,5vw,23px);font-weight:800;padding:6px 10px;min-height:48px}
.wbtn.ok{background:var(--ok-bg);border-color:var(--ok)}
.wbtn.bad{background:var(--miss,var(--bad-bg));border-color:var(--bad)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{background:var(--panel2);border:3px solid var(--line);padding:12px;min-height:58px;font-weight:800;font-size:19px;line-height:1.3;text-align:center}
.opts.one .opt{text-align:left}
.opt:hover:not(:disabled){background:var(--sky)}
.opt.ok,.wbtn.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad,.wbtn.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled,.wbtn:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad),.wbtn:disabled:not(.ok):not(.bad){opacity:.55}
.listen{display:flex;justify-content:center;margin:0 0 16px}
.listen button{font-family:var(--pixel);font-weight:700;font-size:20px;background:var(--torch);color:#1E1B18;padding:10px 18px;min-height:52px}
.arrow{font-size:1.2em}

.order-list{display:grid;gap:8px;margin-bottom:12px}
.oslot{display:flex;gap:10px;align-items:center;min-height:52px;border:3px dashed var(--muted);padding:8px 10px;font-weight:800;text-align:left;background:none;width:100%}
.oslot b{font-family:var(--pixel);font-size:20px;min-width:1.4em}
.oslot.filled{border-style:solid;border-color:var(--line);background:var(--panel2)}
.oslot.ok{border-color:var(--ok);background:var(--ok-bg)}
.oslot.bad{border-color:var(--bad);background:var(--bad-bg)}
.pool{display:grid;gap:8px;margin-bottom:12px}
.pool .opt{text-align:left}
.pool .opt.gone{display:none}
.mine{width:100%;font-size:20px}

.feedback{margin-top:14px;padding:14px 16px;border:3px solid}
.feedback.g{background:var(--ok-bg);border-color:var(--ok)}
.feedback.m{background:var(--bad-bg);border-color:var(--bad)}
.fb-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.fb-title{font-family:var(--pixel);font-weight:700;font-size:28px;line-height:1;margin:0}
.feedback.g .fb-title{color:var(--ok)}
.feedback.m .fb-title{color:var(--bad)}
.fb-gain{display:flex;align-items:center;gap:6px;font-weight:900;margin-left:auto}
.fb-gain .spr{animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes popin{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.feedback p{margin:0 0 12px;font-size:17px}
.new-trophy{background:var(--dirt);color:#fff;padding:8px 12px;font-weight:800;margin:0 0 12px;border:2px solid #000}
.new-trophy b{color:var(--torch)}
.card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.particles{position:fixed;inset:0;pointer-events:none;z-index:15;overflow:hidden}
.particles i{position:absolute;width:10px;height:10px;animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* Final de misión */
.end{background:var(--panel);padding:20px 16px;text-align:center}
.end h1{font-family:var(--pixel);font-weight:700;font-size:clamp(34px,9vw,52px);margin:6px 0;line-height:1}
.end p{margin:6px 0;font-weight:700;color:var(--muted)}
.loot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:14px 0}
.loot div{display:flex;align-items:center;gap:6px;font-weight:900;font-size:20px;background:var(--panel2);border:2px solid var(--line);padding:6px 10px}
.actions{display:grid;gap:10px;margin-top:14px}
.ghost{background:var(--panel);font-weight:900;font-size:18px;min-height:52px}

/* Ventanas de celebración */
#fx{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(10,8,6,.7);cursor:pointer;padding:20px}
#fx.on{display:grid}
.scene{width:min(420px,92vw);text-align:center;color:#fff}
.fx-icon{display:flex;justify-content:center;margin-bottom:10px}
.scene.go .fx-icon{animation:bounce 1s cubic-bezier(.2,1.5,.4,1) both}
@keyframes bounce{0%{transform:scale(0) translateY(40px)}60%{transform:scale(1.15) translateY(-10px)}100%{transform:scale(1)}}
.fx-text{font-family:var(--pixel);font-weight:700;font-size:clamp(40px,11vw,62px);color:var(--torch);text-shadow:4px 4px 0 #000;line-height:1;opacity:0}
.scene.go .fx-text{animation:popin2 .6s cubic-bezier(.2,1.6,.4,1) .35s both}
@keyframes popin2{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.fx-sub{font-weight:900;font-size:20px;margin-top:10px;text-shadow:2px 2px 0 #000}
.fx-skip{color:#C9C2B8;font-size:14px;margin-top:16px}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:21}
.rain i{position:absolute;top:-20px;width:12px;height:12px;border:2px solid rgba(0,0,0,.4);animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}

.modal{position:fixed;inset:0;background:rgba(10,8,6,.7);display:grid;place-items:center;padding:20px;z-index:10}
.modal-card{background:var(--panel);padding:22px 18px;max-width:420px;width:100%}
.modal-card h3{font-family:var(--pixel);font-weight:700;font-size:30px;margin:0 0 6px;line-height:1.1}
.modal-card p{margin:0 0 14px;color:var(--muted);font-weight:700}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0;font:inherit;font-weight:900;font-size:22px;padding:8px 12px;border:3px solid var(--line);background:var(--panel2);color:var(--ink)}

/* Taller del escritor */
:root{--al:#2F5DA8;--at:#C2412F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--al:#8AB4F8;--at:#F28B6E}}
:root[data-theme="dark"]{--al:#8AB4F8;--at:#F28B6E}
.objs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.obj{background:var(--panel2);border:3px solid var(--line);padding:10px;min-height:64px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;text-align:left;line-height:1.2}
.obj .e{font-size:28px}
.obj.done{border-color:var(--ok)}
.obj.done::after{content:"✔";margin-left:auto;color:var(--ok);font-weight:900}
.wtitle{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.wtitle h3{font-family:var(--pixel);font-weight:700;font-size:24px;margin:0;line-height:1.15}
.plan{background:var(--panel2);border-left:6px solid var(--torch);padding:10px 14px;margin:12px 0;font-size:16px;font-weight:700}
.plan ol{margin:6px 0 0;padding-left:22px}
.plan li{margin:3px 0}
.plan i{color:var(--muted)}
.bank{margin:10px 0}
.bank b{display:block;font-size:14px;margin:6px 0 4px}
.bank .chips{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:2px solid var(--line);background:var(--panel);font-weight:900;font-size:16px;padding:4px 10px;min-height:38px}
.wchip.l{color:var(--al)}
.wchip.t{color:var(--at)}
#wtext{width:100%;min-height:200px;font:inherit;font-size:19px;font-weight:700;line-height:1.5;padding:12px;border:3px solid var(--line);background:var(--panel2);color:var(--ink);resize:vertical}
.checks{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;font-weight:800;font-size:16px;line-height:1.35;padding:6px 10px;background:var(--panel2);border:2px solid transparent}
.checks li.ok{border-color:var(--ok)}
.checks li .m{font-weight:900;min-width:1.2em}
.checks li.ok .m{color:var(--ok)}
.tip{color:var(--bad);font-weight:800;font-size:15px;margin:0 0 8px}
.prev{background:var(--panel2);padding:12px;border:2px dashed var(--muted);font-size:18px;line-height:1.6;min-height:3em;overflow-wrap:anywhere}
.prev mark{background:none;font-weight:900;text-decoration:underline;text-underline-offset:3px}
.prev mark.al{color:var(--al)}
.prev mark.at{color:var(--at)}
.legend{font-size:14px;font-weight:800;margin:4px 0 0;color:var(--muted)}
.legend .l{color:var(--al)} .legend .t{color:var(--at)}
.wres{margin-top:14px}
.wres .box{background:var(--panel2);border:3px solid var(--line);padding:12px 14px;margin-bottom:10px}
.wres h4{font-family:var(--pixel);font-weight:700;font-size:20px;margin:0 0 6px}
.wres ul{margin:4px 0 0;padding-left:20px}
.wres li{margin:4px 0;font-weight:700}
.thinking{font-weight:800;color:var(--muted)}

@media (max-width:540px){
  body{font-size:17px}
  .inv{grid-template-columns:repeat(2,1fr)}
  .build{grid-template-columns:1fr}
  .tunnel{grid-template-columns:auto 1fr}
  .tunnel .go{grid-column:1/-1;width:100%}
  .opts{grid-template-columns:1fr}
  .opt{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .fx-text{opacity:1}
}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const ri = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = w => w.toLowerCase().replace(/[.,;:¡!¿?«»—"]/g,"");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- bloques pixelados ---------- */
const STONE = ["#8f8f8f","#7f7f7f","#a1a1a1","#707070"];
const ORE = { hierro:["#e6c39e","#bd8752"], oro:["#fbe068","#dca11a"], diamante:["#8ff5ec","#2fbfb8"] };
const MASK = ["........",".oO.....",".Oo...o.",".....oO.","..o..Oo.",".oO.....",".Oo..oO.",".....O.."];
const MINERALS = ["piedra","hierro","oro","diamante"];
const MNAME = { piedra:"Piedra", hierro:"Hierro", oro:"Oro", diamante:"Diamante" };
function rng(seed){ let s = seed; return () => { s = (s*16807) % 2147483647; return s/2147483647; }; }
function sprite(type, px){
  const r = rng(type.length*131 + 7); let o = `<svg class="spr" width="${px}" height="${px}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">`;
  for (let y=0;y<8;y++) for (let x=0;x<8;x++){
    let c = STONE[Math.floor(r()*4)];
    if (type !== "piedra" && MASK[y][x] !== ".") c = ORE[type][MASK[y][x] === "o" ? 0 : 1];
    o += `<rect x="${x}" y="${y}" width="1" height="1" fill="${c}"/>`;
  }
  return o + "</svg>";
}
const CHEST = ["........",".WWWWWW.","WwwwwwwW","WwwwwwwW","GGGggGGG","WwwggwwW","WwwwwwwW","WWWWWWWW"];
const CHEST_C = { W:"#5e3618", w:"#a0652f", G:"#3b2412", g:"#f5c542" };
function chestSVG(px){
  let o = `<svg class="spr" width="${px}" height="${px}" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true">`;
  CHEST.forEach((row,y)=>row.split("").forEach((ch,x)=>{ if (ch !== ".") o += `<rect x="${x}" y="${y}" width="1" height="1" fill="${CHEST_C[ch]}"/>`; }));
  return o + "</svg>";
}

/* ---------- la casa ---------- */
function area(x0,x1,y0,y1,pal,seed){ const r = rng(seed); const c = []; for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++) c.push([x,y,pal[Math.floor(r()*pal.length)]]); return c; }
const WOOD = ["#7a4a22","#6a3f1c","#84512a"], ROOF = ["#9b3b2b","#86322a","#a8463a"], GLASS = ["#9fd8ef","#7cc4e3"];
const HOUSE = [

function buildQueue(topic){
  const gens = TOPICS[topic].gens, out = [], keys = new Set(), seen = S.seen || (S.seen = {}); let cycle = [], guard = 0;
  while (out.length < QN && guard++ < 300){
    if (!cycle.length) cycle = shuffle(gens);
    const gen = cycle.pop(); let best = null, bestScore = Infinity;
    for (let t=0;t<12;t++){
      const q = gen(); if (keys.has(q.key)) continue;
      const fresh = !(q.key in seen), sc = (fresh ? -1e6 : seen[q.key]) + Math.random();
      if (sc < bestScore){ best = q; bestScore = sc; }
      if (fresh) break;
    }
    if (best){ keys.add(best.key); out.push(best); }
  }
  S.mcount = (S.mcount || 0) + 1;
  out.forEach(q => { if (q.kind !== "listen") seen[q.key] = S.mcount; });
  const ks = Object.keys(seen); if (ks.length > 900) ks.sort((a,b)=>seen[a]-seen[b]).slice(0, ks.length-700).forEach(k=>delete seen[k]);
  save();
  return out;
}

function analyze(text){

  const uniq = arr => Array.from(new Set(arr));
  const lugar = uniq(toks.filter((t,i)=>LSET.has(n[i])).map(t=>t.replace(/[^\p{L}]/gu,"").toLowerCase()));
  const tiempo = uniq(toks.filter((t,i)=>TSET.has(n[i])).map(t=>t.replace(/[^\p{L}]/gu,"").toLowerCase()));
  const chars = uniq(toks.filter((t,i)=>ADJ1.test(n[i]) || ADJ2.test(n[i])).map(t=>t.replace(/[^\p{L}]/gu,"").toLowerCase()));

  const parts = /\btienen?\b|\bformad[oa]s?\b|\bpartes?\b|\bcompuest[oa]s?\b/.test(flat);

    { id:"len", ok: words >= 40, label:`📏 Al menos 40 palabras (${words}/40)` },
    { id:"car", ok: chars.length >= 3, label:`🎨 Cómo es: tamaño, forma, color… (${Math.min(chars.length,3)}/3)${list(chars)}` },
    { id:"par", ok: parts, label:"🧩 Qué partes tiene («Tiene un…, una…»)" },
    { id:"uso", ok: uso, label:"🛠️ Para qué sirve («Sirve para…»)" },
    { id:"lug", ok: lugar.length >= 2, label:`📍 Adverbios de lugar (${Math.min(lugar.length,2)}/2)${list(lugar)}` },
    { id:"tie", ok: tiempo.length >= 2, label:`⏰ Adverbios de tiempo (${Math.min(tiempo.length,2)}/2)${list(tiempo)}` },
    { id:"enu", ok: enu, label:"✒️ Una enumeración con comas y «y» (rojo, azul y verde)" }

}

      if (v === undefined) return `<div class="oslot"><b>${i+1}</b><span style="color:var(--muted)">…</span></div>`;
      const st = q.done ? (v === i ? "ok" : "bad") : "filled";
      return `<button class="oslot ${st}" data-action="unpick" data-i="${i}" ${q.done?"disabled":""}><b>${i+1}</b><span>${esc(q.items[v])}</span></button>`; }).join("") + "</div>";
    if (!q.done) h += `<div class="pool">` + q.pool.map(ix=>`<button class="opt ${q.picked.includes(ix)?"gone":""}" data-action="pick" data-v="${ix}">${esc(q.items[ix])}</button>`).join("") + `</div><button class="go px mine" data-action="check-order" ${q.picked.length < q.items.length ? "disabled" : ""}>⛏️ Picar</button>`;
  }
  return h;
}
function feedback(q){
  if (!q.done) return "";
  const tr = M.fresh.map(id=>{ const t = TROPHIES.find(x=>x.id===id); return `<div class="new-trophy">${t.ic} Nuevo logro: <b>${t.name}</b></div>`; }).join("");
  const gain = q.correct ? `<div class="fb-gain">${sprite(q.gain,34)}+1 ${MNAME[q.gain]}</div>` : "";
  let extra = "";
  if (!q.correct && q.kind === "order") extra = `<br>El orden correcto es: ${q.items.map((s,i)=>`${i+1}. ${esc(s)}`).join(" ")}`;
  return `<div class="feedback ${q.correct?"g":"m"}" role="status"><div class="fb-top"><p class="fb-title">${q.title}</p>${gain}</div><p>${q.explain}${extra}</p>${tr}
    <button class="go px mine" data-action="next">${M.i === QN-1 ? "Salir del túnel" : "⬇️ Seguir bajando"}</button></div>`;
}
function missionView(){
  const T = TOPICS[M.topic];
  const cells = Array.from({length:QN},(_,i)=>{ const r = M.results[i];
    if (r === true) return `<div class="cell">${sprite(M.queue[i].gain,40)}</div>`;
    if (r === false) return `<div class="cell miss"></div>`;
    return `<div class="cell ${i === M.i ? "now" : ""}" ${i > M.i ? 'style="opacity:.55"' : ""}>${i === M.i ? sprite(depthMineral(i),40) : ""}</div>`; }).join("");
  return `<div class="topbar"><button class="back px" data-action="home">← Salir</button><div class="tag">${T.name}<br>${soundBtn("back px")}</div></div>
    <section class="shaft" aria-label="Bloque ${M.i+1} de ${QN}"><div class="depth">${cells}</div>
      <div class="shaft-info"><span>Profundidad ${M.i+1}/${QN}</span><span>Aciertos: ${M.ok} · necesitas ${PASS} para el cofre</span></div></section>
    <section class="card px">${questionBody(M.q)}${feedback(M.q)}</section>`;
}
function endView(){
  const T = TOPICS[M.topic], pass = M.passedNow;
  const got = MINERALS.map(m=>({m,n:M.mined[m] + M.bonus[m]})).filter(x=>x.n);
  return `<section class="end px">${pass ? chestSVG(90) : sprite("piedra",80)}
    <h1>${pass ? (M.ok === QN ? "¡Túnel perfecto!" : "¡Túnel superado!") : "Se acabó el túnel"}</h1>
    <p>${T.name}: has acertado ${M.ok} de ${QN}.</p>
    <p>${pass ? "Has encontrado un cofre con materiales extra." : `Necesitas ${PASS} aciertos para encontrar el cofre. ¡Vuelve a intentarlo!`}</p>
    ${got.length ? `<div class="loot">${got.map(x=>`<div>${sprite(x.m,28)} +${x.n}</div>`).join("")}</div>` : ""}
    <div class="actions"><button class="go px mine" data-action="play" data-topic="${M.topic}">⛏️ Volver a picar</button><button class="ghost px" data-action="home">${canBuild() ? "🔨 Ir a construir" : "Volver al campamento"}</button></div></section>`;
}
function nameModal(){
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="nm"><div class="modal-card px"><h3 id="nm">¿Cómo te llamas?</h3><p>Así sabremos quién es el minero de esta mina.</p>
    <div class="row"><input id="nameIn" type="text" maxlength="16" autocomplete="off" placeholder="Tu nombre" value="${esc(S.name)}"><button class="go px" data-action="save-name">Listo</button></div></div></div>`;
}
function resetModal(){
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rm"><div class="modal-card px"><h3 id="rm">¿Borrar todo?</h3><p>Se borrarán los minerales, la casa y los logros. Esto no se puede deshacer.</p>
    <div class="actions"><button class="go px mine" style="background:var(--bad)" data-action="reset-yes">Sí, borrar todo</button><button class="ghost px" data-action="reset-no" id="resetNo">Cancelar</button></div></div></div>`;
}
const view = document.getElementById("view");
function render(){
  let h = screen === "home" ? homeView() : screen === "mission" ? missionView() : screen === "taller" ? tallerView() : endView();
  if (askName) h += nameModal();
  if (askReset) h += resetModal();
  view.innerHTML = h;
  if (askName){ const n = document.getElementById("nameIn"); if (n) n.focus(); }
  if (screen === "taller") updateChecks();
}

/* ---------- eventos ---------- */
function saveName(){ const n = document.getElementById("nameIn"); S.name = (n && n.value.trim()) || S.name || ""; askName = false; save(); render(); }
view.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b || b.disabled) return;
  const a = b.dataset.action;
  if (a === "play"){ if (b.dataset.topic === "final" && !finalOpen()) return; startMission(b.dataset.topic); }
  else if (a === "home"){ ambStop(); screen = "home"; M = null; render(); window.scrollTo({top:0}); }
  else if (a === "rename"){ askName = true; render(); }
  else if (a === "save-name") saveName();
  else if (a === "sound"){ S.sound = !S.sound; save(); render(); if (S.sound){ SFX.pick(0); if (screen === "mission") ambStart(); } else ambStop(); }
  else if (a === "reset"){ askReset = true; render(); const n = document.getElementById("resetNo"); if (n) n.focus(); }
  else if (a === "reset-yes"){ const nm = S.name; S = fresh(); S.name = nm; askReset = false; save(); render(); window.scrollTo({top:0}); }
  else if (a === "reset-no"){ askReset = false; render(); }
  else if (a === "build") build();
  else if (a === "melody") SFX.melody(M.q.dir, M.q.mel);
  else if (a === "mc"){ const o = M.q.options[Number(b.dataset.ix)]; M.q.chosen = o.v; resolve(o.v === M.q.answer); }
  else if (a === "tap"){ const ix = Number(b.dataset.ix); M.q.chosen = ix; resolve(ix === M.q.answer); }
  else if (a === "pick"){ const v = Number(b.dataset.v); if (!M.q.picked.includes(v)){ M.q.picked.push(v); SFX.pick(0); render(); } }
  else if (a === "unpick"){ M.q.picked.splice(Number(b.dataset.i),1); render(); }
  else if (a === "check-order"){ if (M.q.picked.length === M.q.items.length) resolve(M.q.picked.every((v,i)=>v===i)); }
  else if (a === "next") nextQ();
  else if (a === "taller"){ screen = "taller"; W.key = null; render(); window.scrollTo({top:0}); }
  else if (a === "wobj"){ const [n,e,ar] = WOBJ[Number(b.dataset.i)]; openObj("o"+b.dataset.i, n, e, ar); }
  else if (a === "wcustom"){ const v = (document.getElementById("wcustom").value || "").trim(); if (v) openObj("c:"+v.toLowerCase(), v.replace(/^(un|una|el|la)\s+/i,""), "✏️"); }
  else if (a === "wchange"){ W.key = null; render(); window.scrollTo({top:0}); }
  else if (a === "wsend") entregar();
  else if (a === "ins"){
    const ta = document.getElementById("wtext"); if (!ta) return;
    const w = b.dataset.w, st = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? st, before = ta.value.slice(0,st), after = ta.value.slice(en);
    const ins = (before && !/\s$/.test(before) ? " " : "") + w + (after && !/^\s/.test(after) ? " " : "");
    ta.value = before + ins + after; const pos = (before + ins).length; ta.focus(); ta.setSelectionRange(pos,pos);
    W.text = ta.value; updateChecks(); clearTimeout(wSaveT); wSaveT = setTimeout(()=>{ S.texts[W.key] = W.text; save(); }, 600);
  }
});
view.addEventListener("input", e => {
  if (e.target.id !== "wtext") return;
  W.text = e.target.value; updateChecks();
  clearTimeout(wSaveT); wSaveT = setTimeout(()=>{ if (W.key){ S.texts[W.key] = W.text; save(); } }, 600);
});
view.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "nameIn"){ e.preventDefault(); saveName(); }
  if (e.key === "Enter" && e.target.id === "wcustom"){ e.preventDefault(); const bt = document.querySelector("[data-action=wcustom]"); if (bt) bt.click(); }
});
render();
})();
</script>
</body>
</html>
